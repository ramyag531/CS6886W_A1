method: random

metric:
  goal: maximize
  name: validation_accuracy

parameters:

  activation:
    values:
      - relu
      - sigmoid
      - tanh
      - silu
      - gelu

  optimizer:
    values:
      - adam
      - rmsprop
      - sgd
      - adagrad
      - nadam

  learning_rate:
    values:
      - 0.001
      - 0.0005
      - 0.0001

  batch_size:
    values:
      - 64
      - 128